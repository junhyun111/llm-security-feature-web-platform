name: llm-security

services:
  analyzer:
    build:
      context: .
      dockerfile: model_runtime/Dockerfile
    environment:
      WEB_WORKERS: "1"
      WEB_MAX_UPLOAD_FILES: "2000"
      WEB_MAX_UPLOAD_MB: "256"
      WEB_MAX_SOURCE_FILE_MB: "5"
      WEB_MAX_SOURCE_TOTAL_MB: "100"
      WEB_CANDIDATE_GATE_ENABLED: "true"
      WEB_DETECTION_MAX_PROMPT_CHARACTERS: "120000"
      WEB_DETECTION_MAX_EXPERT_TASKS: "24"
      WEB_DETECTION_MAX_OUTPUT_TOKENS: "8192"
      WEB_PATCH_MAX_PROMPT_CHARACTERS: "120000"
      OPENROUTER_REQUIRE_PARAMETERS: "true"
      OPENROUTER_ALLOW_FALLBACKS: "true"
      OPENROUTER_STRUCTURED_OUTPUT: "true"
      OPENROUTER_REASONING_ENABLED: "false"
      REQUEST_TIMEOUT_SECONDS: "120"
      MAX_RETRIES: "0"
    volumes:
      - ./deploy-data/runtime:/app/work
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      analyzer:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/llm-security.db;Cache=Shared;Foreign Keys=True;Default Timeout=30"
      Analyzer__BaseUrl: http://analyzer:8000
      DataProtection__KeysPath: /app/data-protection
      AllowedHosts: "${ALLOWED_HOSTS:-*}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./deploy-data/sqlite:/app/data
      - ./deploy-data/keys:/app/data-protection
    restart: unless-stopped
