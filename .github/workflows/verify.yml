name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build backend
        working-directory: backend/LlmSecurity.Api
        run: dotnet build -c Release
      - name: Check vulnerable NuGet packages
        working-directory: backend/LlmSecurity.Api
        run: dotnet list package --vulnerable --include-transitive

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: model_runtime/pyproject.toml
      - name: Install runtime
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0"
      - name: Install runtime package
        run: pip install ./model_runtime
      - name: Inspect model artifacts
        run: python model_runtime/run.py inspect
